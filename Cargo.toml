[workspace]
members = ["crates/comux-core", "crates/comux-proxy", "crates/comux-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "6"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
rand = "0.8"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"

